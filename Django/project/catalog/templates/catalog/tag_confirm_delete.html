{% extends "base.html" %}

{% block title %}Delete {{ tag.name }} | Meme Atlas{% endblock %}

{% block content %}
    <h1>Delete tag</h1>

    <p>
        Are you sure you want to delete
        <strong>{{ tag.name }}</strong>?
        This meme will stay and only remove the tag.
    </p>

    <form method="post">
        {% csrf_token %}

        <button type="submit">Yes, delete this tag</button>
        <a href="{% url 'tag-detail' tag.pk %}">Cancel</a>
    </form>
{% endblock %}
