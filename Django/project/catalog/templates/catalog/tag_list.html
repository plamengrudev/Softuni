{% extends "base.html" %}

{% block title %}Tags | Meme Atlas{% endblock %}

{% block content %}
    <h1>Tags</h1>

    <p>
        <a href="{% url 'tag-create' %}">Create a tag</a>
    </p>

    {% if tags %}
        <ul>
            {% for tag in tags %}
                <li>
                    <a href="{% url 'tag-detail' tag.pk %}">
                        {{ tag.name }}
                    </a>
                    ({{ tag.meme_count }})
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No tags have been created yet.</p>
    {% endif %}
{% endblock %}
