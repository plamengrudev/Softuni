{% extends "base.html" %}

{% block title %}Create Category | Meme Atlas{% endblock %}

{% block content %}
    <h1>Create a category</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.non_field_errors }}

        <div>
            {{ form.name.label_tag }}
            {{ form.name }}
            {{ form.name.help_text }}
            {{ form.name.errors }}
        </div>

        <button type="submit">Save category</button>
    </form>

    <a href="{% url 'category-list' %}">Back to categories</a>
{% endblock %}
