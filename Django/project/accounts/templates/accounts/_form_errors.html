{% if form.non_field_errors %}
    <ul class="form-errors" role="alert">
        {% for error in form.non_field_errors %}
            <li>{{ error }}</li>
        {% endfor %}
    </ul>
{% endif %}

{% for field in form %}
    {% if field.errors %}
        <ul class="field-errors" id="{{ field.id_for_label }}-errors" role="alert">
            {% for error in field.errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    {% endif %}
{% endfor %}
