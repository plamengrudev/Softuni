<article>
    <h2>
        <a href="{% url 'meme-detail' meme.pk %}">
            {{ meme.title }}
        </a>
    </h2>

    {% if meme.image %}
        <a href="{% url 'meme-detail' meme.pk %}">
            <img src="{{ meme.image.url }}" alt="{{ meme.title }}" width="300">
        </a>
    {% endif %}
</article>
